apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: autoscaler-capmox-templates
  namespace: default
rules:
  - apiGroups:
      - infrastructure.cluster.x-k8s.io
    resources:
      - proxmoxmachinetemplates
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: autoscaler-capmox-templates
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: autoscaler-capmox-templates
subjects:
  - kind: ServiceAccount
    name: autoscaler-clusterapi-cluster-autoscaler
    namespace: default