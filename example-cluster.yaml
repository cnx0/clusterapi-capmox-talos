apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: example-cluster
  namespace: default
  labels:
    cilium: enabled
spec:
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: TalosControlPlane
    name: capi-example-cp
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: ProxmoxCluster
    name: pve-example-cluster
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxCluster
metadata:
  name: pve-example-cluster
  namespace: default
spec:
  schedulerHints:
    memoryAdjustment: 0
  allowedNodes:
    - pve
  controlPlaneEndpoint:
    host: 192.168.88.100
    port: 6443
  dnsServers:
    - 192.168.88.1
  ipv4Config:
    addresses:
      - 192.168.88.101-192.168.88.150
    gateway: 192.168.88.1
    prefix: 24
---
apiVersion: ipam.cluster.x-k8s.io/v1alpha2
kind: GlobalInClusterIPPool
metadata:
  name: example-storage-pool
spec:
  addresses:
    - 172.16.100.3-172.16.100.100
  prefix: 24
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxMachineTemplate
metadata:
  name: capi-example-cp
  namespace: default
spec:
  template:
    spec:
      disks:
        bootVolume:
          disk: scsi0
          sizeGb: 20
      format: qcow2
      full: true
      memoryMiB: 4096
      network:
        networkDevices:
          - name: net0
            bridge: vmbr0
            model: virtio
            vlan: 30
          - name: net1
            bridge: vmbr1
            model: virtio
            ipPoolRef:
              - apiGroup: ipam.cluster.x-k8s.io
                kind: GlobalInClusterIPPool
                name: example-storage-pool
      numCores: 4
      numSockets: 1
      sourceNode: pve
      templateID: 1000
      checks:
        skipCloudInitStatus: true
      metadataSettings:
        providerIDInjection: true
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxMachineTemplate
metadata:
  name: capi-example-worker
  namespace: default
spec:
  template:
    spec:
      disks:
        bootVolume:
          disk: scsi0
          sizeGb: 20
      format: qcow2
      full: true
      memoryMiB: 4096
      network:
        networkDevices:
          - name: net0
            bridge: vmbr0
            model: virtio
            vlan: 30
          - name: net1
            bridge: vmbr1
            model: virtio
            ipPoolRef:
              - apiGroup: ipam.cluster.x-k8s.io
                kind: GlobalInClusterIPPool
                name: example-storage-pool
      numCores: 4
      numSockets: 1
      sourceNode: pve
      templateID: 1000
      checks:
        skipCloudInitStatus: true
      metadataSettings:
        providerIDInjection: true
---
apiVersion: controlplane.cluster.x-k8s.io/v1alpha3
kind: TalosControlPlane
metadata:
  name: capi-example-cp
spec:
  version: v1.36.0
  replicas: 3
  infrastructureTemplate:
    kind: ProxmoxMachineTemplate
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
    name: capi-example-cp
    namespace: default
  controlPlaneConfig:
    controlplane:
      generateType: controlplane
      strategicPatches:
        - |
          apiVersion: v1alpha1
          kind: ResolverConfig
          nameservers:
            - address: 1.1.1.1
            - address: 1.0.0.1
            - address: 8.8.8.8
            - address: 8.8.4.4
          searchDomains:
            domains:
              - int.home.local
        - |
          apiVersion: v1alpha1
          kind: KubeFlannelCNIConfig
          $patch: delete
        - |
          apiVersion: v1alpha1
          kind: KubeProxyConfig
          $patch: delete
        - |
          apiVersion: v1alpha1
          kind: KubeletConfig
          extraArgs:
            cloud-provider: external
            rotate-server-certificates: "true"
        - |
          apiVersion: v1alpha1
          kind: KubePrismConfig
          port: 7445
        - |
          machine:
            time:
              servers:
                - ntp0.ntp-servers.net
                - ntp1.ntp-servers.net
                - ntp2.ntp-servers.net
            sysctls:
              net.netfilter.nf_conntrack_max: "262144"
            kernel:
              modules:
                - name: br_netfilter
            features:
              kubernetesTalosAPIAccess:
                enabled: true
                allowedRoles:
                  - os:reader
                allowedKubernetesNamespaces:
                  - kube-system
            install:
              disk: /dev/sda
              image: ghcr.io/siderolabs/installer:v1.14.2
              extraKernelArgs:
                - net.ifnames=0
            network:
              interfaces:
                - interface: eth0
                  dhcp: false
                  vip:
                    ip: 192.168.88.100
          cluster:
            externalCloudProvider:
              enabled: true
              manifests:
                - https://raw.githubusercontent.com/siderolabs/talos-cloud-controller-manager/main/docs/deploy/cloud-controller-manager.yml
                - https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/main/deploy/standalone-install.yaml
---
apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
kind: TalosConfigTemplate
metadata:
  name: capi-example-worker
spec:
  template:
    spec:
      generateType: worker
      talosVersion: v1.14.2
      strategicPatches:
        - |
          apiVersion: v1alpha1
          kind: ResolverConfig
          nameservers:
            - address: 1.1.1.1
            - address: 1.0.0.1
            - address: 8.8.8.8
            - address: 8.8.4.4
          searchDomains:
            domains:
              - int.home.local
        - |
          apiVersion: v1alpha1
          kind: KubeletConfig
          extraArgs:
            cloud-provider: external
            rotate-server-certificates: "true"
        - |
          apiVersion: v1alpha1
          kind: KubePrismConfig
          port: 7445
        - |
          machine:
            time:
              servers:
                - ntp0.ntp-servers.net
                - ntp1.ntp-servers.net
                - ntp2.ntp-servers.net
            install:
              disk: /dev/sda
              image: ghcr.io/siderolabs/installer:v1.14.2
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: capi-example-worker
  namespace: default
  annotations:
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: "1"
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: "10"
    capacity.cluster-autoscaler.kubernetes.io/memory: "8G"
    capacity.cluster-autoscaler.kubernetes.io/cpu: "4"
    capacity.cluster-autoscaler.kubernetes.io/ephemeral-disk: "30Gi"
spec:
  clusterName: example-cluster
  replicas: 3
  selector:
    matchLabels: null
  template:
    spec:
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: TalosConfigTemplate
          name: capi-example-worker
      clusterName: example-cluster
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: ProxmoxMachineTemplate
        name: capi-example-worker
      version: v1.36.0
---
